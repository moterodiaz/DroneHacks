# Flight line "window at 2 m/s", chosen by the team (@jsun4231). Since 2026-11-08 it flies the course
# as the team taped it: launch/traj_nav_competitor_window_2mps.launch.py loads
# maps/course_arena_2026-11-08.yaml (Michael Bar On's map from core/flight-iteration, see
# maps/README.md), unless a team map or $DRONEHACKS_MAP is given. It flies at the window's taped
# middle, 1.23 m above the floor, and plans straight over the boulders.
# The launch file applies this file OVER the installed config/traj_nav.example.yaml, so the measured
# values there (rest height, course->odom transform) still apply. Numbers are floats: ROS 2 refuses
# an int for a float parameter.
#
# It takes off rolling (rolling_takeoff_m: FOLLOW starts 0.3 m up and finishes the climb on the
# first leg, held in place only where the path ahead needs the flight height) and descends early
# (early_descent: from the moment the whole drone clears the window, down to descent_floor_m 0.45 m
# above the floor). Both are dronehacks_traj.mission features, off by default. With land: false (the
# installed default, contracts/px4.md: autonomous landing stays blocked) it then holds over the pad at
# that height for the pilot; with land: true it lands with no pause (hold_before_land_s 0).
#
# Before flying it:
# * PX4 doesn't cap the speed on skybeta-11: MPC_XY_VEL_MAX is 12 there (contracts/px4.md, the
#   organisers' value, not ours to write). The plan's v_max_mps and the interface's 2.0 clamp do.
# * The window is not cleared by contracts/course.md: its clearance budget is unreviewed and
#   unvalidated on the kit. On the taped map the window pass keeps 0.137 m over the inscribed radius.
# * Over the boulders, the downward rangefinder reads each rock's top as a floor step; the planner
#   no longer keeps the rangefinder's footprint off them (avoid_boulders false).
# * The unvalidated cornering limit (a_lat_mps2 1.0) binds before 2.0 at most corners.
#   Planned 13.08 m in 16.4 s at 2.0 m/s. SITL results: sitl/README.md.

mission:
  ros__parameters:
    prefer: ["window"]          # CP4 through the window (+5 for a finished window run)
    avoid_boulders: false       # plan straight over the boulders
    rolling_takeoff_m: 0.3      # start the route 0.3 m up and finish the climb on the first leg
    early_descent: true         # descend from the moment the whole drone clears the window
    hold_before_land_s: 0.0     # no pause over the pad (it matters only with land: true)
    track_speed_mps: 2.0        # fly the whole course at this speed (the plan is capped at it)
    v_max_mps: 2.0              # the speed the plan assumes PX4 allows (MPC_XY_VEL_MAX, see above)
    twist_speed_max_mps: 2.0    # must match flight_interface's max_speed_mps below

# The kit's flight interface clamps the norm of every twist setpoint to max_speed_mps
# (competitor_guide.md section 2, default 1.5). The launch file passes this value as the kit's
# documented max_speed_mps launch argument; the interface itself is unchanged.
flight_interface:
  ros__parameters:
    max_speed_mps: 2.0
