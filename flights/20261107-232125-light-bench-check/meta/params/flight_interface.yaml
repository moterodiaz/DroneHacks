/flight_interface:
  ros__parameters:
    allow_mode_request: false
    anchor_setpoints: false
    auto_offboard_on_arm: true
    max_altitude_m: 3.0
    max_speed_mps: 1.5
    min_altitude_m: 0.3
    odom_to_ned_yaw_offset_rad: 0.0
    odometry_topic: /visual_slam/tracking/odometry
    pose_setpoint_topic: /skybeta/setpoint/pose
    setpoint_rate_hz: 10.0
    setpoint_timeout_s: 1.0
    state_rate_hz: 5.0
    state_topic: /skybeta/state
    target_system: 1
    twist_setpoint_topic: /skybeta/setpoint/twist
    use_sim_time: false
    warn_period_s: 2.0

