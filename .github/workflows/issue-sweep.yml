name: issue-sweep

# Closes review-finding issues once their PR merges; pings the holder of stalled PRs.
# Never merges, approves, or edits state labels (docs/BOARD.md). Throttled to one ping per PR per 24h.

on:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (print actions, write nothing)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
        run: |
          bash .github/scripts/issue-sweep.sh | sed 's/^JUDGE/::warning::JUDGE/; s/^SKIP issue/::notice::SKIP issue/'
