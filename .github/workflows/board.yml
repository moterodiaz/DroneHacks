name: board

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

# Uses pull_request (not pull_request_target) because contributors push branches
# as collaborators, not forks. If external forks start contributing, switch the
# label-stripping steps to pull_request_target and keep checkout untrusted-code-free.

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: reset review state to needs-review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for l in in-review review-passed changes-requested; do
            gh pr edit "$PR" --repo "$REPO" --remove-label "$l" 2>/dev/null || true
          done
          gh pr edit "$PR" --repo "$REPO" --add-label needs-review
